<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập quản trị</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-container">
        <form class="login-form" action="admin.html">
            <div class="login-avatar">PF</div>

            <h1>Đăng nhập</h1>
            <p>Vào khu vực quản trị Portfolio cá nhân</p>

            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>

            <button type="submit" class="btn btn-primary full-width">Đăng nhập</button>

            <a href="index.html" class="back-home">Quay lại trang chính</a>
        </form>
    </main>

</body>
</html>
